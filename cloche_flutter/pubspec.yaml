name: cloche_app
description: "CLOCHE — Luxury Wedding Rental Marketplace Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.7.0

  # State Management
  provider: ^6.1.2

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Image
  cached_network_image: ^3.4.1

  # UI / Icons
  google_fonts: ^6.2.1

  # Routing
  go_router: ^14.6.2

  # Utilities
  intl: ^0.20.2
  shared_preferences: ^2.3.3

  # Image picker (for partner profile upload)
  image_picker: ^1.1.2

  # URL launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
