<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLOCHE | Message Boutique</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&family=Inter:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#c1a671",
            "background-dark": "#0d0d0d",
            "surface-dark": "#1a1a1a"
          },
          fontFamily: {
            display: ["Noto Serif", "serif"],
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    .glass-card {
      background: rgba(10, 10, 10, 0.85);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(193, 166, 113, 0.15);
    }

    .search-bar-gold {
      background: rgba(26, 26, 26, 0.8);
      border: 1px solid rgba(193, 166, 113, 0.3);
      border-radius: 999px;
      transition: all 0.3s ease;
    }

    .search-bar-gold:focus-within {
      border-color: #c1a671;
      box-shadow: 0 0 15px rgba(193, 166, 113, 0.1);
    }

    .chat-item {
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.2s ease;
    }

    .chat-item:hover {
      background: rgba(193, 166, 113, 0.03);
    }

    .chat-item.active {
      background: rgba(193, 166, 113, 0.08);
      border-left: 3px solid #c1a671;
    }

    .avatar-gold {
      border: 1.5px solid #c1a671;
      padding: 2px;
      border-radius: 50%;
      background: #000;
    }

    .font-premium-display {
      font-family: 'Noto Serif', serif;
      letter-spacing: 0.1em;
    }

    .font-premium-sans {
      font-family: 'Inter', sans-serif;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #3e382d;
      border-radius: 10px;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    :root {
      --cloche-topbar-h: 64px;
    }

    @media (min-width: 768px) {
      :root {
        --cloche-topbar-h: 80px;
      }
    }

    html,
    body {
      min-height: 100%;
      overflow-x: hidden;
      overflow-y: auto;
    }

    main {
      margin-top: var(--cloche-topbar-h) !important;
      min-height: calc(100dvh - var(--cloche-topbar-h)) !important;
      height: auto !important;
      overflow: visible !important;
      padding-top: 0 !important;
    }

    html.direct-chat,
    body.direct-chat,
    html.chat-scroll-locked,
    body.chat-scroll-locked {
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden !important;
      overscroll-behavior: none;
      touch-action: none;
    }

    body.direct-chat,
    body.chat-scroll-locked {
      position: fixed;
      inset: 0;
      width: 100%;
    }

    body.direct-chat main,
    body.chat-scroll-locked main {
      height: calc(100dvh - var(--cloche-topbar-h)) !important;
      min-height: 0 !important;
      overflow: hidden !important;
      overscroll-behavior: none;
    }

    /* If global mobile navbar is active, avoid double top spacing. */
    body.has-mobile-bars #pageNav {
      display: none !important;
    }

    body.has-mobile-bars main {
      margin-top: 0 !important;
      min-height: calc(100dvh - 76px) !important;
      height: auto !important;
    }

    body.has-mobile-bars.direct-chat main,
    body.has-mobile-bars.chat-scroll-locked main {
      height: calc(100dvh - 76px) !important;
      min-height: 0 !important;
    }

    body.direct-chat #messagesArea,
    body.direct-chat #messageInput,
    body.chat-scroll-locked #messagesArea,
    body.chat-scroll-locked #messageInput {
      touch-action: auto;
    }

    body.direct-chat #chatPane,
    body.chat-scroll-locked #chatPane {
      overscroll-behavior: none;
      contain: layout paint;
    }

    body.direct-chat #activeChat,
    body.chat-scroll-locked #activeChat {
      min-height: 0;
      overflow: hidden;
    }

    body.direct-chat #messagesArea,
    body.chat-scroll-locked #messagesArea {
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 1024px) {
      /* Global mobile navbar height is 76px (see responsive-fixes.css). Keep chat header visible. */
      body.has-mobile-bars #chatPane {
        top: 76px !important;
        height: calc(100dvh - 76px) !important;
      }
    }

    #inboxPane {
      min-height: 0 !important;
    }

    #conversationList {
      flex: 1 1 auto !important;
      min-height: 0 !important;
      overflow-y: auto !important;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Direct chat route: open selected boutique chat (no inbox list) */
    body.direct-chat #inboxPane {
      display: none !important;
    }

    @media (min-width: 1024px) {
      /* Single column layout for desktop - Full width feel */
      .grid.lg\:grid-cols-\[400px_1fr\] {
        grid-template-columns: 1fr !important;
        gap: 0 !important;
      }

      /* Premium Wide Layout for Enquiries */
      #inboxPane {
        max-width: 100% !important;
        margin: 0 !important;
        height: 100% !important;
        border: none !important;
        background: transparent !important;
      }

      /* Precision Header Spacing - Left Aligned to match list */
      #inboxPane .flex-col.px-5 {
        padding: 3rem 4rem 1.5rem 4rem !important;
      }

      /* Heading: Gold, Large, Uppercase, Primary alignment */
      #inboxPane h2 {
        font-size: 14px !important;
        margin-bottom: 0.85rem !important;
        letter-spacing: 0.35em !important;
        color: #c1a671 !important;
        text-align: left !important;
      }

      /* Search: Proportional width, balanced like Partner Messages */
      .search-bar-gold {
        max-width: 420px !important;
        margin-bottom: 2rem !important;
        margin-left: 0 !important;
      }

      /* List item padding with consistent luxury feel */
      .chat-item {
        padding: 1.5rem 4rem !important;
      }

      /* Overlay chat pane for desktop (WhatsApp style transition) */
      #chatPane {
        position: fixed !important;
        inset: 0 !important;
        z-index: 100 !important;
        transform: translateX(100%);
        transition: transform 0.45s cubic-bezier(0.4, 0, 0.2, 1);
        background: #0d0d0d !important;
        display: flex !important;
        visibility: hidden;
        border-left: 1px solid rgba(193, 166, 113, 0.2);
      }

      #chatPane.active {
        transform: translateX(0);
        visibility: visible;
      }

      /* Ensure back button shows on desktop chat view */
      #chatPane #chatHeader button {
        display: block !important;
      }
    }

    @media (max-width: 768px) {

      /* Mobile chat focus slide-in focus mode */
      #chatPane {
        position: fixed !important;
        top: 64px !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        height: calc(100dvh - 64px) !important;
        z-index: 60 !important;
        transform: translateX(100%);
        transition: transform 0.3s ease-out;
        background: #0d0d0d !important;
        display: flex !important;
        visibility: hidden;
      }

      #chatPane.active {
        transform: translateX(0);
        visibility: visible;
      }

      /* Compact Header for mobile */
      nav.fixed {
        height: 64px !important;
      }

      main {
        padding-top: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
        overflow: hidden !important;
      }

      .grid-cols-\[400px_1fr\] {
        grid-template-columns: 1fr !important;
      }

      #inboxPane {
        height: 100% !important;
        min-height: 0 !important;
      }

      .search-bar-gold {
        margin-top: 0 !important;
        margin-bottom: 0 !important;
      }

      #conversationList {
        flex: 1 1 auto !important;
        min-height: 0 !important;
        overflow-y: auto !important;
        margin-top: 0 !important;
      }

      .chat-item {
        padding: 0.75rem 1rem !important;
      }

      .avatar-gold {
        width: 3.25rem !important;
        height: 3.25rem !important;
      }
    }
  </style>

<body class="bg-background-dark text-white min-h-screen">

      <a href="index.html" class="flex items-center gap-2">
        <span class="material-symbols-outlined text-primary text-2xl md:text-3xl">diamond</span>
        <span class="text-xl md:text-2xl font-bold md:tracking-[0.2em] font-display">CLOCHE</span>
      </a>
      <div class="flex items-center gap-3">
        <a id="profileLink" href="userprofile.html"
          class="text-[10px] md:text-xs uppercase tracking-widest text-white/60 hover:text-primary transition-colors">Profile</a>
        <button id="logoutBtn"
          class="h-8 md:h-10 px-3 md:px-5 rounded-full border border-primary/30 text-primary text-[10px] md:text-xs uppercase tracking-wider font-bold hover:bg-primary hover:text-black transition-all">Logout</button>

        class="glass-card rounded-xl md:rounded-2xl overflow-hidden flex flex-col bg-background-dark/40">
        <!-- New Search Header -->
        <div class="px-5 py-2 md:pt-6 md:pb-4 md:border-b md:border-white/5 md:bg-black/20 flex flex-col">
          <!-- Heading (Mobile & Desktop Order 1) -->
          <div class="hidden md:flex mb-4 items-center justify-between">
            <h2
              class="text-[8.5px] md:text-[10px] uppercase tracking-[0.2em] md:tracking-[0.25em] text-primary font-bold">
              YOUR ENQUIRIES ON BOUTIQUES</h2>
          </div>

          <!-- Search (Mobile & Desktop Order 2) -->
          <div class="search-bar-gold order-2 flex items-center gap-2 px-4 py-1.5 md:py-2.5 md:mb-4">
            <span class="material-symbols-outlined text-primary/60 text-lg">search</span>

      <section id="chatPane" class="glass-card md:rounded-2xl overflow-hidden flex flex-col bg-background-dark">

          <p class="font-premium-display text-sm tracking-widest uppercase">Select an enquiry to start chatting</p>

        <div id="activeChat" class="hidden flex-1 flex flex-col min-h-0">

                class="h-10 w-10 text-xl font-bold rounded-xl bg-primary text-black flex items-center justify-center hover:scale-105 active:scale-95 transition-all shadow-lg">

  </main>

  <script>
    const API_ORIGIN = "https://cloche-backend.onrender.com";
    const API = `${API_ORIGIN}/api/messages`;
    const AUTH_API = `${API_ORIGIN}/api/auth`;
    const userId = localStorage.getItem("userId");
    let userName = localStorage.getItem("userName") || "Customer";
    let userEmail = localStorage.getItem("userEmail") || "";
    let activeConversationId = null;
    let conversationsRaw = [];
    let conversations = [];
    let directChatScrollY = 0;

    // Normalize route based on query params only, not localStorage fallbacks
    (function normalizeDirectChatRoute() {
      try {
        const p = new URLSearchParams(window.location.search);
        // If we explicitly want the list view, clear any potential boutique IDs from the URL
        if (p.get("view") === "list") {
          p.delete("boutiqueId");
          p.delete("conversationId");
          window.history.replaceState(null, "", `${window.location.pathname}?${p.toString()}`);
          return;
        }
      } catch (e) {}
    })();

    const routeCtx = getQueryContext();
    const isDirectChatRoute = Boolean(routeCtx.conversationId || routeCtx.boutiqueId);
    let didDirectOpen = false;

    function lockChatScroll() {
      directChatScrollY = window.scrollY || document.documentElement.scrollTop || 0;
      document.documentElement.classList.add("chat-scroll-locked");
      document.body.classList.add("chat-scroll-locked");
      document.body.style.top = `-${directChatScrollY}px`;
      window.scrollTo(0, 0);
    }

    function unlockChatScroll() {
      if (isDirectChatRoute) return;
      document.documentElement.classList.remove("chat-scroll-locked");
      document.body.classList.remove("chat-scroll-locked");
      document.body.style.top = "";
      window.scrollTo(0, directChatScrollY);
    }

    function lockDirectChatScroll() {
      if (!isDirectChatRoute) return;
      document.documentElement.classList.add("direct-chat");
      document.body.classList.add("direct-chat");
      lockChatScroll();
    }

    function keepDirectChatScrollLocked() {
      if (!document.body.classList.contains("chat-scroll-locked")) return;
      if ((window.scrollY || document.documentElement.scrollTop || 0) !== 0) {
        window.scrollTo(0, 0);
      }
    }

    function requireUserSession() {
      if (localStorage.getItem("isUserLoggedIn") !== "true" || !userEmail) {
        window.location.href = "boutiquelogin.html";
        return false;
      }
      return true;
    }

    function getQueryContext() {
      const p = new URLSearchParams(window.location.search);

      const parsePositiveInt = (value) => {
        const n = Number(String(value || "").trim());
        return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0;
      };

      const conversationId = parsePositiveInt(
        p.get("conversationId") ||
        p.get("conversation_id") ||
        p.get("convId") ||
        p.get("conversation")
      );

      const boutiqueId = parsePositiveInt(
        p.get("boutiqueId") ||
        p.get("boutique_id") ||
        p.get("boutiqueID") ||
        p.get("boutiqueid") ||
        p.get("id")
      );

      const productName = String(
        p.get("productName") ||
        p.get("product_name") ||
        ""
      ).trim();

      const productImage = String(
        p.get("productImage") ||
        p.get("product_image") ||
        ""
      ).trim();

      const productUrl = String(
        p.get("productUrl") ||
        p.get("product_url") ||
        ""
      ).trim();

      const boutiqueName = String(
        p.get("boutiqueName") ||
        p.get("boutique_name") ||
        p.get("boutique") ||
        ""
      ).trim();

      return { conversationId, boutiqueId, productName, productImage, productUrl, boutiqueName };
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function parseProductShareMessage(text) {
      const raw = String(text || "");
      const prefix = "__CLOCHE_PRODUCT_SHARE__";
      if (!raw.startsWith(prefix)) return null;
      try {
        const data = JSON.parse(raw.slice(prefix.length));
        if (!data || !data.name) return null;
        return data;
      } catch (_) {
        return null;
      }
    }

    function renderProductShareCard(share) {
      const image = escapeHtml(share.image || "");
      const url = escapeHtml(share.url || "#");
      const name = escapeHtml(share.name || "Shared dress");
      return `
        <a href="${url}" class="block overflow-hidden rounded-2xl border border-primary/25 bg-primary/10 text-left shadow-xl shadow-primary/5">
          ${image ? `<img src="${image}" alt="${name}" class="h-44 w-full object-cover" loading="lazy">` : ""}
          <div class="p-4">
            <p class="text-[9px] uppercase tracking-[0.24em] text-primary/70 font-bold mb-1">Shared Dress</p>
            <p class="font-display text-sm text-white leading-tight">${name}</p>
          </div>
        </a>
      `;
    }

    async function readJsonSafe(res) {
      const text = await res.text();
      try {
        return text ? JSON.parse(text) : {};
      } catch {
        return { message: "Unexpected server response format." };
      }
    }

    async function bootstrapConversationFromContext() {
      const { conversationId, boutiqueId, productName } = getQueryContext();
      if (conversationId) {
        activeConversationId = conversationId;
        return;
      }
      if (!boutiqueId) return;

      const payload = {
        boutiqueId,
        customer_name: userName,
        customer_email: userEmail,
        product_name: productName || null
      };

      try {
        const res = await fetch(`${API}/customer/conversation`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const data = await readJsonSafe(res);
        if (res.ok && data.conversationId) {
          activeConversationId = data.conversationId;
        }
      } catch (err) {
        console.error("Failed to initialize conversation", err);
      }
    }

    async function sendSharedProductMessageOnce() {
      const { productName, productImage, productUrl } = getQueryContext();
      if (!activeConversationId || !productName) return;

      const shareKey = `clocheSharedProductMessage.${activeConversationId}.${productName}`;
      if (sessionStorage.getItem(shareKey) === "sent") return;

      const sharedPost = {
        type: "product_share",
        name: productName,
        image: productImage,
        url: productUrl
      };

      try {
        const res = await fetch(`${API}/send`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            conversationId: activeConversationId,
            message_text: `__CLOCHE_PRODUCT_SHARE__${JSON.stringify(sharedPost)}`,
            senderType: "customer"
          })
        });

        const data = await readJsonSafe(res);
        if (!res.ok) throw new Error(data.message || "Failed to share product");
        sessionStorage.setItem(shareKey, "sent");
      } catch (err) {
        console.error("Failed to send shared product message", err);
      }
    }

    function timeLabel(value) {
      if (!value) return "";
      const d = new Date(value);
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function timeValue(value) {
      const d = new Date(value);
      const t = d.getTime();
      return Number.isFinite(t) ? t : 0;
    }

    function getBoutiqueGroupKey(conv) {
      const rawId = conv?.boutique_id ?? conv?.boutiqueId ?? conv?.boutiqueID ?? conv?.boutiqueid;
      const numericId = rawId === 0 || rawId ? Number(rawId) : NaN;
      if (Number.isFinite(numericId) && numericId > 0) return `boutique:${numericId}`;

      const name = String(conv?.boutique_name || "").trim().toLowerCase();
      if (name) return `boutique_name:${name}`;

      return `conversation:${String(conv?.id || "")}`;
    }

    // WhatsApp-style inbox grouping: one boutique = one chat row
    function groupConversationsByBoutique(rawConversations) {
      const groups = new Map();
      const list = Array.isArray(rawConversations) ? rawConversations : [];

      list.forEach((conv) => {
        if (!conv) return;
        const key = getBoutiqueGroupKey(conv);
        let g = groups.get(key);
        if (!g) {
          g = {
            group_key: key,
            ids: [],
            unread_count: 0,
            _bestTime: 0,
            id: null,
            boutique_name: "",
            product_name: "",
            last_message: "",
            last_message_time: null,
          };
          groups.set(key, g);
        }

        if (conv.id != null) g.ids.push(conv.id);
        g.unread_count += Number(conv.unread_count || 0);

        const candidateTime = Math.max(
          timeValue(conv.last_message_time),
          timeValue(conv.updated_at),
          timeValue(conv.created_at)
        );

        if (!g.id || candidateTime >= g._bestTime) {
          g._bestTime = candidateTime;
          g.id = conv.id;
          g.last_message_time = conv.last_message_time || conv.updated_at || conv.created_at || g.last_message_time;
          g.last_message = conv.last_message || g.last_message;
          g.product_name = conv.product_name || g.product_name;
          g.boutique_name = conv.boutique_name || g.boutique_name;
        } else {
          if (!g.boutique_name && conv.boutique_name) g.boutique_name = conv.boutique_name;
          if (!g.product_name && conv.product_name) g.product_name = conv.product_name;
        }
      });

      const grouped = Array.from(groups.values());
      grouped.sort((a, b) => timeValue(b.last_message_time) - timeValue(a.last_message_time));
      return grouped;
    }

    async function loadConversations() {
      try {
        const res = await fetch(`${API}/customer/conversations?email=${encodeURIComponent(userEmail)}`);
        const data = await readJsonSafe(res);
        if (!res.ok) throw new Error(data.message || "Failed to load conversations");

        let raw = Array.isArray(data) ? data : [];

        // Direct-chat route: only show the selected boutique's thread(s) behind the chat screen.
        if (isDirectChatRoute && routeCtx.boutiqueId) {
          const targetBoutiqueId = Number(routeCtx.boutiqueId);
          raw = raw.filter((c) => {
            const id = Number(c?.boutique_id ?? c?.boutiqueId ?? 0);
            return id && id === targetBoutiqueId;
          });
        }

        conversationsRaw = raw;
        conversations = groupConversationsByBoutique(conversationsRaw);
        renderConversationList();

        if (activeConversationId) {
          const exists = conversationsRaw.some(c => Number(c.id) === Number(activeConversationId));
          if (exists) {
            openConversation(activeConversationId, true);
          }
        }
      } catch (err) {
        document.getElementById("conversationList").innerHTML = `<div class="p-5 text-red-300/60 text-[10px] tracking-wider uppercase text-center">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderConversationList() {
      const list = document.getElementById("conversationList");
      if (!conversations.length) {
        list.innerHTML = `<div class="p-10 text-white/20 text-center uppercase tracking-widest text-[10px]">No enquiries yet</div>`;
        return;
      }

      const searchTerm = document.getElementById("searchInput")?.value.toLowerCase() || "";

      list.innerHTML = conversations
        .filter(c => (c.boutique_name || "").toLowerCase().includes(searchTerm))
        .map(c => {
          const active = Array.isArray(c.ids) && c.ids.some(id => Number(id) === Number(activeConversationId));
          const name = (c.boutique_name || "Boutique").toUpperCase();
          const initial = name.charAt(0);
          const sharedPost = parseProductShareMessage(c.last_message);
          const preview = sharedPost ? `Shared dress: ${sharedPost.name}` : (c.last_message || "Product Enquiry Started");

          return `
            <div 
              class="chat-item p-4 md:p-5 cursor-pointer flex items-center gap-4 ${active ? "active" : ""}"
              onclick="openConversation(${c.id})"
            >
              <!-- Avatar Area -->
              <div class="avatar-gold size-12 md:size-14 flex-shrink-0">
                <div class="w-full h-full rounded-full bg-surface-dark flex items-center justify-center text-primary font-bold text-lg">
                  ${initial}
                </div>
              </div>

              <!-- Message Details -->
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-baseline mb-1">
                  <h3 class="font-premium-display text-[13px] md:text-sm font-bold text-white tracking-wider truncate">${name}</h3>
                  <span class="text-[9px] md:text-[10px] text-white/30 font-medium ml-2">${timeLabel(c.last_message_time)}</span>
                </div>
                <div class="flex items-center justify-between">
                  <p class="text-[11px] md:text-xs text-white/50 line-clamp-1 font-premium-sans">${escapeHtml(preview)}</p>
                  ${Number(c.unread_count) > 0 ? `
                    <span class="min-w-5 h-5 px-1.5 bg-primary rounded-full text-[10px] font-black text-black flex items-center justify-center shadow-[0_0_12px_rgba(193,166,113,0.35)]">${Number(c.unread_count)}</span>
                  ` : ""}
                </div>
              </div>
            </div>
          `;
        }).join("");
    }

    async function closeChat() {
      if (isDirectChatRoute) {
        const bId = routeCtx.boutiqueId;
        if (bId) {
          // If we came from a specific boutique, go back to that boutique
          window.location.href = `viewboutique.html?boutiqueId=${bId}`;
        } else if (document.referrer) {
          window.history.back();
        } else {
          window.location.href = "messageboutique.html?view=list";
        }
        return;
      }
      document.getElementById("chatPane").classList.remove("active");
      unlockChatScroll();
      activeConversationId = null;
      await loadConversations();
    }

    async function openConversation(conversationId, quiet = false) {
      activeConversationId = Number(conversationId);
      lockChatScroll();
      if (!quiet) {
        document.getElementById("chatPane").classList.add("active");
      }

      renderConversationList();

      const convo =
        conversationsRaw.find(c => Number(c.id) === Number(conversationId)) ||
        conversations.find(g => Array.isArray(g.ids) && g.ids.some(id => Number(id) === Number(conversationId)));
      if (convo) {
        document.getElementById("chatDefault").classList.add("hidden");
        document.getElementById("activeChat").classList.remove("hidden");
        document.getElementById("chatBoutique").textContent = String(convo.boutique_name || "BOUTIQUE").toUpperCase();
        document.getElementById("chatContext").textContent = String(convo.product_name || "General Enquiry").toUpperCase();
      } else if (isDirectChatRoute) {
        // If we landed here from "Message Boutique" we may not have the list hydrated yet.
        document.getElementById("chatDefault").classList.add("hidden");
        document.getElementById("activeChat").classList.remove("hidden");
        document.getElementById("chatBoutique").textContent = String(routeCtx.boutiqueName || "BOUTIQUE").toUpperCase();
        document.getElementById("chatContext").textContent = String(routeCtx.productName || "General Enquiry").toUpperCase();
      }

      try {
        const res = await fetch(`${API}/customer/conversation/${conversationId}`);
        const msgs = await readJsonSafe(res);
        if (!res.ok) throw new Error(msgs.message || "Failed to load messages");
        renderMessages(Array.isArray(msgs) ? msgs : []);
      } catch (err) {
        document.getElementById("messagesArea").innerHTML = `<div class="p-10 text-red-300 text-xs text-center uppercase tracking-widest">${escapeHtml(err.message)}</div>`;
      }
    }

    function renderMessages(messages) {
      const area = document.getElementById("messagesArea");
      if (!messages.length) {
        area.innerHTML = `<div class="h-full flex items-center justify-center text-white/20 text-[10px] uppercase tracking-[0.2em] italic">No messages in this enquiry yet</div>`;
        return;
      }

      area.innerHTML = messages.map(m => {
        const isUser = m.sender_type === "customer";
        const sharedPost = parseProductShareMessage(m.message_text);
        const body = sharedPost
          ? renderProductShareCard(sharedPost)
          : `<p class="text-[13px] md:text-sm leading-relaxed">${escapeHtml(m.message_text)}</p>`;
        return `
          <div class="mb-5 flex ${isUser ? "justify-end" : "justify-start"}">
            <div class="max-w-[85%] md:max-w-[78%] ${isUser ? "bg-primary/10 border-primary/25 text-primary" : "bg-white/5 border-white/10 text-white/90"} border rounded-2xl px-4 py-3 shadow-sm">
              ${body}
              <p class="text-[9px] mt-2 ${isUser ? "text-primary/60" : "text-white/30"} text-right font-medium">${timeLabel(m.created_at)}</p>
            </div>
          </div>
        `;
      }).join("");

      area.scrollTop = area.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("messageInput");
      const text = String(input.value || "").trim();
      if (!text || !activeConversationId) return;

      try {
        const res = await fetch(`${API}/send`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            conversationId: activeConversationId,
            message_text: text,
            senderType: "customer"
          })
        });
        const data = await readJsonSafe(res);
        if (!res.ok) throw new Error(data.message || "Failed to send message");
        input.value = "";
        await openConversation(activeConversationId, true);
        await loadConversations();
      } catch (err) {
        alert(err.message || "Failed to send message");
      }
    }

    async function hydrateUserIfNeeded() {
      if (!userId || userEmail) return;
      try {
        const res = await fetch(`${AUTH_API}/user/${userId}`);
        const data = await readJsonSafe(res);
        if (res.ok && data.email) {
          localStorage.setItem("userEmail", data.email);
          if (data.name) localStorage.setItem("userName", data.name);
          userEmail = String(data.email || "").trim();
          userName = String(data.name || userName).trim() || "Customer";
        }
      } catch (err) {
        console.error("Failed to hydrate user session", err);
      }
    }

    document.getElementById("sendBtn").addEventListener("click", sendMessage);
    document.getElementById("messageInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.addEventListener("DOMContentLoaded", async () => {
      lockDirectChatScroll();
      window.addEventListener("scroll", keepDirectChatScrollLocked, { passive: true });
      await hydrateUserIfNeeded();
      userEmail = localStorage.getItem("userEmail") || userEmail;
      userName = localStorage.getItem("userName") || userName;
      if (!requireUserSession()) return;
      await bootstrapConversationFromContext();

      // WhatsApp-like behavior: clicking "Message Boutique" opens that boutique's chat directly.
      // Direct route should not hydrate the full inbox list (privacy + UX).
      if (isDirectChatRoute) {
        // Make the chat pane visible immediately (desktop + mobile slide-in UIs rely on `.active`).
        document.getElementById("chatPane").classList.add("active");

        if (!activeConversationId) {
          document.getElementById("chatDefault").classList.add("hidden");
          document.getElementById("activeChat").classList.remove("hidden");
          document.getElementById("chatBoutique").textContent = String(routeCtx.boutiqueName || "BOUTIQUE").toUpperCase();
          document.getElementById("chatContext").textContent = String(routeCtx.productName || "General Enquiry").toUpperCase();
          document.getElementById("messagesArea").innerHTML = `<div class="h-full flex items-center justify-center text-white/30 text-[10px] uppercase tracking-[0.2em] italic">Opening chat...</div>`;
        }

        const tickDirect = async () => {
          if (!activeConversationId) {
            await bootstrapConversationFromContext();
          }
          if (!activeConversationId) return;

          if (!didDirectOpen) {
            didDirectOpen = true;
            await sendSharedProductMessageOnce();
            await openConversation(activeConversationId, false);
            return;
          }

          await openConversation(activeConversationId, true);
        };

        await tickDirect();
        setInterval(tickDirect, 3000);
        return;
      }

      await loadConversations();
      setInterval(loadConversations, 3000);
    });

    window.addEventListener("pageshow", async (event) => {
      if (!event.persisted) return;
      if (!requireUserSession()) return;
      if (isDirectChatRoute) {
        if (!activeConversationId) {
          await bootstrapConversationFromContext();
        }
        if (activeConversationId) {
          await openConversation(activeConversationId, true);
        }
        return;
      }
      await loadConversations();
    });
  </script>
  <script src='responsive-layout.js?v=20260501-partner-signup'></script>
  <script src="footer.js?v=20260505-footer-fix"></script>
