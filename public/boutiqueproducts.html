<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Boutique Product Management | CLOCHE</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#c1a671",
            "background-light": "#f7f6f2",
            "background-dark": "#0d0d0d",
            "card-dark": "rgba(26, 26, 26, 0.6)",
          },
          fontFamily: {
            "display": ["Noto Serif", "serif"],
            "sans": ["Noto Sans", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    .glass-card { backdrop-filter: blur(12px); border: 1px solid rgba(193, 166, 113, 0.1); transition: all 0.3s ease; }
    .glass-card:hover { border-color: rgba(193, 166, 113, 0.4); transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(193, 166, 113, 0.2); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0d0d0d; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3e382d; border-radius: 10px; }
    .sidebar-item-active { background: linear-gradient(90deg, rgba(193, 166, 113, 0.1) 0%, rgba(193, 166, 113, 0) 100%); border-left: 3px solid #c1a671; }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-sans text-slate-900 dark:text-white selection:bg-primary/30 min-h-screen overflow-x-hidden">
  <div class="flex min-h-screen w-full overflow-hidden">
    <!-- Sidebar Navigation (Compatible with responsive-layout.js) -->
    <aside class="w-72 bg-background-dark border-r border-primary/10 flex flex-col z-20 shrink-0 h-screen">
      <div class="p-8 flex items-center gap-4 shrink-0">
          <div class="h-10 w-10 bg-primary rounded-full flex items-center justify-center text-background-dark font-bold text-xl">C</div>
          <div>
              <h1 class="text-primary text-xl font-black tracking-widest uppercase leading-none">CLOCHE</h1>
              <p class="text-primary/60 text-[10px] tracking-[0.2em] uppercase font-sans mt-1">Boutique Management</p>
          </div>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-2 font-sans overflow-y-auto custom-scrollbar">
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="dashboard.html">
              <span class="material-symbols-outlined">dashboard</span>
              <span class="text-sm font-medium tracking-wide">Dashboard</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="lead.html">
              <span class="material-symbols-outlined">group</span>
              <span class="text-sm font-medium tracking-wide">Leads</span>
          </a>
          <a class="sidebar-item-active flex items-center gap-4 px-4 py-3 text-primary group" href="boutiqueproducts.html">
              <span class="material-symbols-outlined">inventory_2</span>
              <span class="text-sm font-medium tracking-wide">Products</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="messages.html">
              <span class="material-symbols-outlined">chat_bubble</span>
              <span class="text-sm font-medium tracking-wide">Messages</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="subscription.html">
              <span class="material-symbols-outlined">star</span>
              <span class="text-sm font-medium tracking-wide">Subscription</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="profile.html">
              <span class="material-symbols-outlined">settings</span>
              <span class="text-sm font-medium tracking-wide">Settings</span>
          </a>
      </nav>
      <div class="p-4 border-t border-white/5">
          <button onclick="window.logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-slate-400 hover:text-primary hover:bg-primary/10 transition-all duration-300">
              <span class="material-symbols-outlined text-base">logout</span> Logout
          </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="h-20 border-b border-primary/10 flex items-center justify-between px-6 md:px-10 bg-background-light/50 dark:bg-background-dark/50 backdrop-blur-md z-10">
          <div class="flex items-center gap-4">
              <button id="menuBtn" class="lg:hidden p-2 text-primary">
                  <span class="material-symbols-outlined">menu</span>
              </button>
              <h2 class="font-display text-xl md:text-2xl font-bold tracking-tight text-white uppercase whitespace-nowrap">Inventory</h2>
          </div>
          <div class="flex items-center gap-6">
              <a href="boutiqueaddproduct.html" class="flex items-center gap-2 bg-primary text-background-dark px-4 md:px-6 py-2.5 rounded-xl font-bold text-xs md:text-sm shadow-lg shadow-primary/10 hover:shadow-primary/20 transition-all uppercase tracking-wide">
                  <span class="material-symbols-outlined">add</span> <span class="hidden sm:inline">Add Product</span><span class="sm:hidden text-[10px]">Add</span>
              </a>
          </div>
      </header>
      <div class="flex-1 overflow-y-auto custom-scrollbar p-6 md:p-10 bg-background-dark">
          <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 md:gap-8">
              <!-- Products injected here -->
          </div>
      </div>
    </main>
  </div>

  <script>
    const API_BASE = "/api";
    let allProducts = [];
    const boutiqueId = localStorage.getItem("boutiqueId");
    const userPlan = (localStorage.getItem("plan") || "early").toLowerCase();
    const maxProducts = userPlan === "premium" ? Infinity : 20;

    async function fetchProducts() {
      if (!boutiqueId) return;
      try {
        const res = await fetch(`${API_BASE}/products/boutique/${boutiqueId}`);
        if (!res.ok) throw new Error("Failed to fetch products");
        allProducts = await res.json();
        renderProducts();
      } catch (e) { 
        console.error(e);
        document.getElementById('productGrid').innerHTML = `<div class="col-span-full py-20 text-center text-white/40">Error loading products.</div>`;
      }
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = "";
      
      if (allProducts.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full py-20 text-center">
            <div class="mb-4 opacity-20"><span class="material-symbols-outlined text-6xl">inventory_2</span></div>
            <p class="text-white/40 uppercase tracking-widest text-sm">No products in your catalog yet.</p>
            <a href="boutiqueaddproduct.html" class="mt-6 inline-block text-primary font-bold hover:underline">Click here to add your first product</a>
          </div>
        `;
        return;
      }

      allProducts.forEach(p => {
        const primaryImg = p.image_url || 'https://via.placeholder.com/300?text=No+Image';
        const card = `
          <div class="glass-card bg-card-dark rounded-xl overflow-hidden group shadow-2xl flex flex-col">
            <div class="aspect-[3/4] overflow-hidden relative bg-black/40">
                <img src="${primaryImg}" class="w-full h-full object-cover transition-transform group-hover:scale-105 duration-500" alt="${p.product_name}">
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
            </div>
            <div class="p-5 flex-1 flex flex-col">
                <p class="text-[10px] text-primary uppercase tracking-[0.2em] mb-1 font-bold">${p.category || 'Collection'}</p>
                <h4 class="font-display font-bold text-lg text-white mb-1 uppercase truncate">${p.product_name}</h4>
                <p class="text-primary font-bold text-xl mb-4">₹${Number(p.price).toLocaleString('en-IN')}</p>
                <div class="mt-auto flex items-center justify-between pt-4 border-t border-white/5">
                    <a href="boutiqueproduct.html?boutiqueId=${boutiqueId}&productId=${p.id}" class="text-[10px] uppercase font-bold text-white/60 hover:text-primary transition-colors">Details/Edit</a>
                    <button onclick="deleteProduct(${p.id}, '${p.product_name.replace(/'/g, "\\'")}')" class="text-red-400 text-[10px] uppercase font-bold hover:text-red-300">Delete</button>
                </div>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', card);
      });
    }

    async function deleteProduct(id, name) {
        if (!confirm(`Are you sure you want to delete ${name}?`)) return;
        try {
          const res = await fetch(`${API_BASE}/products/${id}`, { method: "DELETE" });
          if (res.ok) {
            fetchProducts();
          } else {
            const err = await res.json();
            alert(err.message || "Failed to delete product");
          }
        } catch (e) {
          alert("Network error. Please try again.");
        }
    }

    window.onload = fetchProducts;
  </script>
  <script src='responsive-layout.js?v=1776237132140'></script>
</body>
</html>
</html>
