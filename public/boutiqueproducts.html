<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Boutique Product Management | CLOCHE</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700;900&amp;family=Noto+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet" />
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#c1a671",
            "background-light": "#f7f6f2",
            "background-dark": "#0d0d0d",
            "card-dark": "rgba(26, 26, 26, 0.6)",
          },
          fontFamily: {
            "display": ["Noto Serif", "serif"],
            "sans": ["Noto Sans", "sans-serif"]
          },
          borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
        },
      },
    }
  </script>
  <style>
    .glass-card { backdrop-filter: blur(12px); border: 1px solid rgba(193, 166, 113, 0.1); transition: all 0.3s ease; }
    .glass-card:hover { border-color: rgba(193, 166, 113, 0.4); transform: translateY(-4px); box-shadow: 0 10px 30px -10px rgba(193, 166, 113, 0.2); }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0d0d0d; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3e382d; border-radius: 10px; }
    .sidebar-item-active { background: linear-gradient(90deg, rgba(193, 166, 113, 0.1) 0%, rgba(193, 166, 113, 0) 100%); border-left: 3px solid #c1a671; }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-sans text-slate-900 dark:text-white selection:bg-primary/30 h-screen overflow-hidden">
  <div class="flex h-screen overflow-hidden">
    <aside class="w-72 bg-background-dark border-r border-primary/10 flex flex-col z-20 shrink-0 h-screen">
      <div class="p-8 flex items-center gap-4 shrink-0">
          <div class="h-10 w-10 bg-primary rounded-full flex items-center justify-center text-background-dark font-bold text-xl">C</div>
          <div>
              <h1 class="text-primary text-xl font-black tracking-widest uppercase leading-none">CLOCHE</h1>
              <p class="text-primary/60 text-[10px] tracking-[0.2em] uppercase font-sans mt-1">Boutique Management</p>
          </div>
      </div>
      <nav class="flex-1 px-4 py-6 space-y-2 font-sans overflow-y-auto custom-scrollbar">
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="dashboard.html">
              <span class="material-symbols-outlined">dashboard</span>
              <span class="text-sm font-medium tracking-wide">Dashboard</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="lead.html">
              <span class="material-symbols-outlined">group</span>
              <span class="text-sm font-medium tracking-wide">Leads</span>
          </a>
          <a class="sidebar-item-active flex items-center gap-4 px-4 py-3 text-primary group" href="boutiqueproducts.html">
              <span class="material-symbols-outlined">inventory_2</span>
              <span class="text-sm font-medium tracking-wide">Products</span>
          </a>
          <a class="flex items-center gap-4 px-4 py-3 text-slate-400 hover:text-primary transition-colors group" href="subscription.html">
              <span class="material-symbols-outlined">star</span>
              <span class="text-sm font-medium tracking-wide">Subscription</span>
          </a>
      </nav>
      <div class="p-4 border-t border-white/5">
          <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-semibold text-slate-400 hover:text-primary hover:bg-primary/10 transition-all duration-300">
              <span class="material-symbols-outlined text-base">logout</span> Logout
          </button>
      </div>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
      <header class="h-20 border-b border-primary/10 flex items-center justify-between px-10 bg-background-light/50 dark:bg-background-dark/50 backdrop-blur-md z-10">
          <h2 class="font-display text-2xl font-bold tracking-tight text-white">Boutique Inventory</h2>
          <div class="flex items-center gap-6">
              <button onclick="toggleModal()" class="flex items-center gap-2 bg-primary text-background-dark px-6 py-2.5 rounded-xl font-bold text-sm shadow-lg shadow-primary/10 hover:shadow-primary/20 transition-all uppercase tracking-wide">
                  <span class="material-symbols-outlined">add</span> Add New Product
              </button>
          </div>
      </header>
      <div class="flex-1 overflow-y-auto custom-scrollbar p-10 bg-background-dark">
          <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
              <!-- Products injected here -->
          </div>
      </div>
    </main>
  </div>

  <!-- Add Product Modal -->
  <div id="addProductModal" class="fixed inset-0 bg-background-dark/90 backdrop-blur-md z-50 hidden overflow-y-auto py-10 px-4">
    <div class="bg-card-dark border border-primary/20 rounded-2xl w-full max-w-md p-8 glass-card mx-auto relative shadow-2xl transition-all duration-300 transform scale-100 opacity-100" id="modalContent">
      <div class="flex justify-between items-center mb-6">
        <h3 class="font-display text-2xl font-bold text-primary">Add New Product</h3>
        <button onclick="toggleModal()" class="text-primary/60 hover:text-primary">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <form id="addProductForm" class="space-y-4 font-sans">
        <input type="text" id="pName" placeholder="Product Name" required class="w-full bg-primary/5 border border-primary/20 rounded-xl px-4 py-3 text-white text-sm" />
        <input type="number" id="pPrice" placeholder="Rent Price (₹)" required class="w-full bg-primary/5 border border-primary/20 rounded-xl px-4 py-3 text-white text-sm" />
        <select id="pCategory" class="w-full bg-primary/5 border border-primary/20 rounded-xl px-4 py-3 text-white text-sm outline-none">
          <option value="Couture" style="background:#1a1a1a">Couture</option>
          <option value="Traditional" style="background:#1a1a1a">Traditional</option>
          <option value="Bridal" style="background:#1a1a1a">Bridal</option>
          <option value="Jewelry" style="background:#1a1a1a">Jewelry</option>
        </select>
        <textarea id="pDescription" placeholder="Description" rows="3" class="w-full bg-primary/5 border border-primary/20 rounded-xl px-4 py-3 text-white text-sm"></textarea>
        <input type="text" id="pLocation" placeholder="Location" class="w-full bg-primary/5 border border-primary/20 rounded-xl px-4 py-3 text-white text-sm" />
        <button type="submit" class="w-full bg-primary text-background-dark py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-white transition-all mt-4">Upload Product</button>
      </form>
    </div>
  </div>

  <script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
  <script>
    const API_BASE = "/api";
    let allProducts = [];
    const boutiqueId = localStorage.getItem("boutiqueId");
    const userPlan = (localStorage.getItem("plan") || "early").toLowerCase();
    const maxProducts = userPlan === "premium" ? Infinity : 20;

    // Global logout is now handled by responsive-layout.js

    function toggleModal() {
      if (!isEditing && allProducts.length >= maxProducts) {
          alert(`Product limit reached (${maxProducts}). Please upgrade to Premium.`);
          return;
      }
      const modal = document.getElementById('addProductModal');
      modal.classList.toggle('hidden');
    }

    let isEditing = false;
    let editProductId = null;

    async function fetchProducts() {
      if (!boutiqueId) return;
      try {
        const res = await fetch(`${API_BASE}/products/boutique/${boutiqueId}`);
        allProducts = await res.json();
        renderProducts();
      } catch (e) { console.error(e); }
    }

    function renderProducts() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = "";
      
      allProducts.forEach(p => {
        const card = `
          <div class="glass-card bg-card-dark rounded-xl overflow-hidden group shadow-2xl p-6">
            <h4 class="font-display font-bold text-lg text-white mb-1 uppercase truncate">${p.product_name}</h4>
            <p class="text-primary font-bold text-xl mb-4">₹${p.price}</p>
            <div class="flex gap-2">
                <button onclick="deleteProduct(${p.id})" class="text-red-400 text-xs uppercase font-bold hover:text-red-300">Delete</button>
            </div>
          </div>
        `;
        grid.insertAdjacentHTML('beforeend', card);
      });

      if (allProducts.length < maxProducts) {
        const addCard = `
           <button onclick="toggleModal()" class="flex flex-col items-center justify-center border-2 border-dashed border-primary/20 rounded-xl aspect-[3/4] hover:bg-primary/5 transition-all group p-10 text-center">
              <span class="material-symbols-outlined text-4xl text-primary mb-4">add_circle</span>
              <p class="text-xs text-primary/60 uppercase font-bold">Add Product</p>
           </button>
        `;
        grid.insertAdjacentHTML('beforeend', addCard);
      } else {
        const lockCard = `
           <div class="flex flex-col items-center justify-center border-2 border-dashed border-red-500/20 rounded-xl aspect-[3/4] bg-red-500/5 p-10 text-center">
              <span class="material-symbols-outlined text-4xl text-red-400 mb-4">lock</span>
              <p class="text-xs text-red-400/60 uppercase font-bold">Limit Reached</p>
              <a href="subscription.html" class="mt-4 px-4 py-2 bg-primary text-background-dark rounded font-bold text-[10px] uppercase">Upgrade</a>
           </div>
        `;
        grid.insertAdjacentHTML('beforeend', lockCard);
      }
    }

    async function deleteProduct(id) {
        if (!confirm("Delete?")) return;
        await fetch(`${API_BASE}/products/${id}`, { method: "DELETE" });
        fetchProducts();
    }

    document.getElementById('addProductForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
          product_name: document.getElementById('pName').value,
          price: document.getElementById('pPrice').value,
          category: document.getElementById('pCategory').value,
          description: document.getElementById('pDescription').value,
          location: document.getElementById('pLocation').value,
          boutiqueId: boutiqueId
      };
      
      const res = await fetch(`${API_BASE}/products/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
      });
      if (res.ok) {
          toggleModal();
          fetchProducts();
      } else {
          const err = await res.json();
          alert(err.message);
      }
    });

    window.onload = fetchProducts;
  </script>
</body>
</html>
