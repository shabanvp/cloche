<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submit Payment Proof | CLOCHE</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Noto+Sans:wght@400;500;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#c1a671",
            "background-dark": "#0d0d0d",
            "surface-dark": "#1a1a1a"
          },
          fontFamily: {
            display: ["Noto Serif", "serif"],
            sans: ["Noto Sans", "sans-serif"]
          }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-background-dark text-white font-sans">
  <main class="min-h-screen flex items-center justify-center px-5 py-10">
    <section class="w-full max-w-xl rounded-2xl border border-primary/20 bg-surface-dark/70 p-6 md:p-8 shadow-2xl">
      <a href="subscription.html" class="text-[10px] uppercase tracking-[0.25em] text-primary/70 hover:text-primary">Back to Plans</a>
      <h1 class="font-display text-3xl md:text-4xl mt-6 mb-3">Submit Payment Proof</h1>
      <p class="text-white/55 text-sm leading-relaxed mb-8">
        Upload the UPI payment screenshot. Admin will review it and activate your plan after approval.
      </p>

      <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 mb-8">
        <div class="rounded-xl border border-white/10 bg-black/20 p-4">
          <p class="text-[9px] uppercase tracking-widest text-primary/70 mb-1">Plan</p>
          <p id="proofPlan" class="font-bold uppercase">-</p>
        </div>
        <div class="rounded-xl border border-white/10 bg-black/20 p-4">
          <p class="text-[9px] uppercase tracking-widest text-primary/70 mb-1">Amount</p>
          <p id="proofAmount" class="font-bold">-</p>
        </div>
        <div class="rounded-xl border border-white/10 bg-black/20 p-4">
          <p class="text-[9px] uppercase tracking-widest text-primary/70 mb-1">Cycle</p>
          <p id="proofCycle" class="font-bold uppercase">-</p>
        </div>
      </div>

      <div class="space-y-5">
        <button id="openUpiBtn" type="button" class="w-full rounded-xl border border-primary/40 px-5 py-3 text-primary text-xs font-bold uppercase tracking-widest hover:bg-primary hover:text-black transition-all">
          Open UPI Payment Again
        </button>

        <label class="block">
          <span class="block text-[10px] uppercase tracking-[0.25em] text-white/50 mb-3">Payment Screenshot</span>
          <input id="screenshot" type="file" accept="image/*" class="w-full rounded-xl border border-white/10 bg-black/30 p-3 text-sm text-white file:mr-4 file:rounded-lg file:border-0 file:bg-primary file:px-4 file:py-2 file:text-black file:font-bold" />
        </label>

        <button id="submitProofBtn" type="button" onclick="submitProof()" class="w-full rounded-xl bg-primary px-5 py-4 text-black text-xs font-black uppercase tracking-widest hover:bg-white transition-all">
          Submit for Review
        </button>

        <p id="proofStatus" class="min-h-5 text-center text-xs text-white/50"></p>
      </div>
    </section>
  </main>

  <script>
    const API_ORIGIN = "https://cloche-backend.onrender.com";
    const CLOUDINARY_CLOUD_NAME = "dycwsnzyd";
    const CLOUDINARY_UPLOAD_PRESET = "cloche_upload";

    const selectedPlan = localStorage.getItem("selectedPlan") || "";
    const selectedAmount = localStorage.getItem("selectedAmount") || "";
    const selectedCycle = localStorage.getItem("selectedBillingCycle") || "monthly";
    const boutiqueId = localStorage.getItem("selectedBoutiquePaymentId") || localStorage.getItem("boutiqueId") || "";
    const upiLink = localStorage.getItem("selectedUpiLink") || "";

    document.getElementById("proofPlan").textContent = selectedPlan || "-";
    document.getElementById("proofAmount").textContent = selectedAmount ? `₹${Number(selectedAmount).toLocaleString("en-IN")}` : "-";
    document.getElementById("proofCycle").textContent = selectedCycle || "-";

    document.getElementById("openUpiBtn").addEventListener("click", () => {
      if (!upiLink) return alert("Please choose a plan first.");
      window.location.href = upiLink;
    });

    async function submitProof() {
      const status = document.getElementById("proofStatus");
      const btn = document.getElementById("submitProofBtn");
      const file = document.getElementById("screenshot").files[0];

      if (!boutiqueId || !selectedPlan || !selectedAmount) {
        alert("Plan details missing. Please select a plan again.");
        window.location.href = "subscription.html";
        return;
      }
      if (!file) {
        status.textContent = "Choose a payment screenshot first.";
        status.className = "min-h-5 text-center text-xs text-red-300";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Uploading...";
      status.textContent = "Uploading screenshot...";
      status.className = "min-h-5 text-center text-xs text-white/50";

      try {
        const formData = new FormData();
        formData.append("file", file);
        formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

        const cloudRes = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData
        });
        const cloudData = await cloudRes.json();
        if (!cloudData.secure_url) throw new Error(cloudData.error?.message || "Cloudinary upload failed");

        status.textContent = "Submitting proof...";
        const proofRes = await fetch(`${API_ORIGIN}/api/payment/proof`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            boutiqueId,
            plan: selectedPlan,
            amount: Number(selectedAmount),
            billingCycle: selectedCycle,
            screenshotUrl: cloudData.secure_url
          })
        });
        const proofData = await proofRes.json();
        if (!proofRes.ok) throw new Error(proofData.message || "Failed to submit proof");

        status.textContent = "Submitted. Admin will review within 24 hours.";
        status.className = "min-h-5 text-center text-xs text-primary";
        btn.textContent = "Submitted";
        localStorage.removeItem("selectedPlan");
        localStorage.removeItem("selectedAmount");
        localStorage.removeItem("selectedBillingCycle");
        localStorage.removeItem("selectedBoutiquePaymentId");
        localStorage.removeItem("selectedUpiLink");
      } catch (err) {
        status.textContent = err.message || "Could not submit proof.";
        status.className = "min-h-5 text-center text-xs text-red-300";
        btn.disabled = false;
        btn.textContent = "Submit for Review";
      }
    }
  </script>
</body>
</html>
