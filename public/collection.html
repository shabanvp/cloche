<script src="product-upload-utils.js?v=20260515-upload-normalizer"></script>
<script>
    const API_ORIGIN = "https://cloche-backend.onrender.com";
    const API_AUTH = `${API_ORIGIN}/api/auth`;
    const API_PRODUCTS = `${API_ORIGIN}/api/products`;
    const COLLECTIONS_CACHE_KEY = "allCollectionsCacheV1";
    const COLLECTIONS_RETRY_DELAYS_MS = [0, 2000, 5000];
    const COLLECTIONS_FETCH_TIMEOUT_MS = 60000;
    let collectionsLoadInProgress = false;
    let collectionsRetryTimer = null;

    let allItems = [];

    function escapeHtml(v) {
      return String(v || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function normalizePlan(plan) {
      const normalized = String(plan || "early_partner").trim().toLowerCase();
      if (["early", "basic", "early partner", "early_partner"].includes(normalized)) return "early_partner";
      if (normalized === "pro") return "premium";
      return normalized;
    }

    function shouldShowVerifiedBadge(item) {
      if (item?.is_verified_partner_product === true) return true;
      const plan = normalizePlan(item?.boutique_plan || item?.plan);
      return plan === "professional" || plan === "premium";
    }

  function resolveAssetUrl(url) {
    if (window.CLOCHE_PRODUCTS?.resolveAssetUrl) return addCacheBuster(window.CLOCHE_PRODUCTS.resolveAssetUrl(url, API_ORIGIN));
    let raw = String(url || "").trim();
    if (!raw) return "";
    if (/^data:image\//i.test(raw)) return raw;
    
    if (raw.includes("localhost") || raw.includes("127.0.0.1")) {
       try {
           const u = new URL(raw);
           raw = u.pathname;
       } catch(e) {}
    }
    if (/^https?:\/\//i.test(raw)) return addCacheBuster(raw);

    const normalized = raw.replace(/\\/g, "/");
    const lower = normalized.toLowerCase();
    const uploadsWithSlash = lower.indexOf("/uploads/");
    if (uploadsWithSlash >= 0) return addCacheBuster(`${API_ORIGIN}${normalized.slice(uploadsWithSlash)}`);
    const uploadsNoSlash = lower.indexOf("uploads/");
    if (uploadsNoSlash >= 0) return addCacheBuster(`${API_ORIGIN}/${normalized.slice(uploadsNoSlash)}`);

    // Try to detect Cloudinary public ID (has .png .jpg .jpeg .webp) without being a full path
    if (/\.(png|jpg|jpeg|webp)$/i.test(normalized) && !normalized.includes("/")) {
      return addCacheBuster(`https://res.cloudinary.com/dycwsnzyd/image/upload/${normalized}`);
    }

    return addCacheBuster(`${API_ORIGIN}${normalized.startsWith("/") ? "" : "/"}${normalized}`);
  }
  function addCacheBuster(url) {
    if (!url) return url;
    const separator = url.includes('?') ? '&' : '?';
    return `${url}${separator}v=${Math.floor(Date.now() / 60000)}`;
  }
    function wait(ms) {
      return new Promise((resolve) => setTimeout(resolve, ms));
    }

    async function fetchWithTimeout(url, timeoutMs = 10000, options = {}) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        clearTimeout(timeoutId);
        return res;
      } catch (error) {
        clearTimeout(timeoutId);
        throw error;
      }
    }

    function pickProductImage(item) {
      const gallery = window.CLOCHE_PRODUCTS?.getProductImages
        ? window.CLOCHE_PRODUCTS.getProductImages(item, API_ORIGIN)
        : (Array.isArray(item.gallery) ? item.gallery : []);
      const firstValid = gallery[0] || item.image_url || "";
      const resolved = /^https?:\/\//i.test(firstValid) ? firstValid : resolveAssetUrl(firstValid);
      const busted = addCacheBuster(resolved);
      return busted;
    }

    function showCollectionSkeletons(count = 8) {
      const grid = document.getElementById("collectionGrid");
      if (!grid) return;
      grid.innerHTML = Array(count).fill(0).map(() => `
        <div class="glass-card rounded-xl overflow-hidden block animate-pulse">
          <div class="aspect-[2/3] bg-surface-dark/50"></div>
          <div class="p-4 space-y-3">
            <div class="h-4 bg-gray-600/30 rounded w-3/4"></div>
            <div class="h-3 bg-gray-600/30 rounded w-1/2"></div>
            <div class="h-2 bg-gray-600/30 rounded w-1/3"></div>
          </div>
        </div>
      `).join("");
    }

    function renderItems(items) {
      const grid = document.getElementById("collectionGrid");
      const status = document.getElementById("collectionStatusText");

      status.textContent = "";

      if (!items.length) {
        grid.innerHTML = `
          <div class="col-span-full glass-card rounded-xl p-8 text-center text-white/60">
            No live collection items found.
          </div>
        `;
        return;
      }

      grid.innerHTML = items.map((item) => {
        if (item.category === "Couture") item.category = "Bridal";
        const image = pickProductImage(item);
        const category = escapeHtml(item.category || "Collection");
        const name = escapeHtml(item.product_name || "Untitled Product");
        const boutiqueName = escapeHtml(item.boutique_name || "Boutique");
        const location = escapeHtml(item.location || item.city || "Location");
        const productId = encodeURIComponent(item.id || "");
        const boutiqueId = encodeURIComponent(item.boutique_id || "");
        const safeImage = escapeHtml(image);
        const verifiedBadge = ""; // Removed from collection cards as per request

        return `
          <a href="viewproducts.html?productId=${productId}" onclick="localStorage.setItem('selectedBoutiqueId','${boutiqueId}')"
             class="collection-listing-card listing-product-card glass-card rounded-xl overflow-hidden block hover:border-primary/40 transition-all">
            <div class="product-image-frame aspect-[3/4] bg-surface-dark overflow-hidden relative">
              ${image
                ? `<img src="${safeImage}" alt="${name}" class="product-image w-full h-full object-cover" loading="lazy" onerror="console.warn('Image failed to load:', this.src); this.style.display='none';" />`
                : `<div class="w-full h-full flex items-center justify-center text-white/40 text-xs tracking-[0.2em] uppercase">No Image</div>`
              }
              <span class="absolute top-2 left-2 bg-primary/90 text-black text-[9px] px-2 py-1 rounded tracking-[0.2em] uppercase font-bold">${category}</span>
              ${verifiedBadge}
            </div>
            <div class="p-3 sm:p-4">
              <p class="font-display text-lg leading-tight mb-2">${name}</p>
              <p class="text-[10px] sm:text-xs uppercase tracking-[0.22em] text-primary">${boutiqueName}</p>
              <p class="text-[10px] text-white/50 mt-1 uppercase tracking-[0.18em]">${location}</p>
            </div>
          </a>
        `;
      }).join("");
    }

    let selectedCategory = "";

    function filterByCategory(cat) {
      selectedCategory = cat;
      const buttons = document.querySelectorAll('.cat-btn');
      buttons.forEach(btn => {
        const btnCat = btn.textContent.trim();
        if ((cat === '' && btnCat === 'All') || btnCat === cat) {
          btn.className = "cat-btn active-cat px-5 py-2 rounded-full border border-primary/40 bg-primary/10 text-primary text-xs font-bold uppercase tracking-widest transition-all";
        } else {
          btn.className = "cat-btn px-5 py-2 rounded-full border border-white/10 bg-white/5 text-white/70 text-xs font-bold uppercase tracking-widest hover:border-primary/30 transition-all";
        }
      });
      applySearch();
    }

    function applySearch() {
      const input = document.getElementById("collectionSearchInput");
      const q = String(input?.value || "").trim().toLowerCase();
      
      let filtered = allItems;
      
      if (selectedCategory) {
        filtered = filtered.filter(item => String(item.category || "").toLowerCase() === selectedCategory.toLowerCase());
      }

      if (q) {
        filtered = filtered.filter((item) => {
          return [
            item.product_name,
            item.category,
            item.boutique_name,
            item.location,
            item.city
          ].some((field) => String(field || "").toLowerCase().includes(q));
        });
      }
      renderItems(filtered);
    }

    function loadCollectionsFromCache() {
      try {
        const cached = localStorage.getItem(COLLECTIONS_CACHE_KEY);
        if (cached) {
          const { data, timestamp } = JSON.parse(cached);
          const ageHours = (Date.now() - timestamp) / (1000 * 60 * 60);
          if (ageHours < 24) {
            console.log("[Collection] Serving from cache, age:", ageHours.toFixed(2), "hours");
            allItems = data;
            renderItems(allItems);
            return true;
          }
        }
      } catch (e) {
        console.warn("[Collection] Cache read error:", e);
      }
      return false;
    }

    async function fetchCollectionsWithRetry(statusEl) {
      let lastError = null;
      for (let attempt = 0; attempt < COLLECTIONS_RETRY_DELAYS_MS.length; attempt += 1) {
        const delay = COLLECTIONS_RETRY_DELAYS_MS[attempt];
        if (delay > 0) {
          if (statusEl) {
            statusEl.textContent = `Connecting... (attempt ${attempt + 1}/${COLLECTIONS_RETRY_DELAYS_MS.length})`;
          }
          await wait(delay);
        }

        try {
          console.log(`[Collection] Fetch attempt ${attempt + 1} with ${COLLECTIONS_FETCH_TIMEOUT_MS}ms timeout...`);
          const res = await fetchWithTimeout(`${API_PRODUCTS}`, COLLECTIONS_FETCH_TIMEOUT_MS);
          const data = await res.json().catch(() => []);
          if (!res.ok) throw new Error(data.message || "Failed to load collection");
          console.log(`[Collection] Fetch successful on attempt ${attempt + 1}`);
          return Array.isArray(data) ? data : [];
        } catch (err) {
          console.log(`[Collection] Attempt ${attempt + 1} failed:`, err.message);
          lastError = err;
        }
      }
      throw lastError || new Error("Failed to load collection");
    }

    async function loadCollectionData() {
      if (collectionsLoadInProgress) return;
      collectionsLoadInProgress = true;
      const status = document.getElementById("collectionStatusText");
      const grid = document.getElementById("collectionGrid");

      try {
        // Try cache first
        const hasCache = loadCollectionsFromCache();
        
        if (!hasCache && status) {
          const cachedRaw = localStorage.getItem(COLLECTIONS_CACHE_KEY);
          let cachedItems = [];
          try {
            if (cachedRaw) {
               const parsed = JSON.parse(cachedRaw);
               cachedItems = Array.isArray(parsed?.data) ? parsed.data : [];
            }
          } catch (_) {}
          
          const skeletonCount = cachedItems.length > 0 ? Math.min(cachedItems.length, 12) : 8;
          showCollectionSkeletons(skeletonCount);
          if (status) status.textContent = "Loading live collection...";
        }

        // Fresh fetch
        const data = await fetchCollectionsWithRetry(status);
        allItems = data.sort((a, b) => {
          const aT = new Date(a.created_at || 0).getTime();
          const bT = new Date(b.created_at || 0).getTime();
          return bT - aT;
        });

        localStorage.setItem(COLLECTIONS_CACHE_KEY, JSON.stringify({
          data: allItems,
          timestamp: Date.now()
        }));

        renderItems(allItems);
        if (status) status.textContent = "";
        console.log(`[Collection] Successfully loaded ${allItems.length} items`);
      } catch (err) {
        console.log("[Collection] Load failed, trying cache:", err.message);
        const hasCache = loadCollectionsFromCache();
        if (!hasCache) {
          showCollectionSkeletons(4);
          if (status) status.textContent = "Unable to load collection. Retrying...";
        }
        if (!collectionsRetryTimer) {
          collectionsRetryTimer = setTimeout(() => {
            collectionsRetryTimer = null;
            console.log("[Collection] Retrying load...");
            loadCollectionData();
          }, 5000);
        }
      } finally {
        collectionsLoadInProgress = false;
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("collectionSearchInput")?.addEventListener("input", applySearch);
      loadCollectionData();
    });
  </script>
