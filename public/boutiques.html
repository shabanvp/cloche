  <script>
    const API_AUTH = "https://cloche-backend.onrender.com/api/auth";
    const API_BASE = "https://cloche-backend.onrender.com/api";
    const API_ORIGIN = "https://cloche-backend.onrender.com";
    const DEBUG_TAGS = new URLSearchParams(window.location.search).has("debugTags");
    if (DEBUG_TAGS) console.log("[CLOCHE] boutiques.html v20260503-boutique-tags");
    const imgPool = [
      "https://images.unsplash.com/photo-1583391733981-849840f3f1c2?q=80&w=1200&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1524504388940-b1c1722653e1?q=80&w=1200&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1542060748-10c28b62716f?q=80&w=1200&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?q=80&w=1200&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=1200&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1529139574466-a303027c1d8b?q=80&w=1200&auto=format&fit=crop"
    ];

    let boutiques = [];
    let selectedDistrict = "";
    let selectedTown = "";
    let searchTerm = "";
    let cloudinaryCloudName = "";

    const aliases = {
      perumbavoor: ["perumbavoor", "perumbavur"],
      perumbavur: ["perumbavoor", "perumbavur"],
      kochi: ["kochi", "cochin", "ernakulam"],
      cochin: ["kochi", "cochin", "ernakulam"],
      edappally: ["edappally", "edapally"],
      edapally: ["edappally", "edapally"],
      trivandrum: ["trivandrum", "thiruvananthapuram"],
      thiruvananthapuram: ["trivandrum", "thiruvananthapuram"]
    };

    function normalizeText(value) {
      return String(value || "")
        .normalize("NFKC")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");
    }

    function getSearchVariants(value) {
      const normalized = normalizeText(value);
      if (!normalized) return [];
      return aliases[normalized] || [normalized];
    }

    function levenshteinDistance(a, b) {
      const left = normalizeText(a);
      const right = normalizeText(b);
      if (left === right) return 0;
      if (!left) return right.length;
      if (!right) return left.length;

      const previous = Array.from({ length: right.length + 1 }, (_, i) => i);
      const current = Array(right.length + 1).fill(0);

      for (let i = 1; i <= left.length; i += 1) {
        current[0] = i;
        for (let j = 1; j <= right.length; j += 1) {
          const cost = left[i - 1] === right[j - 1] ? 0 : 1;
          current[j] = Math.min(
            current[j - 1] + 1,
            previous[j] + 1,
            previous[j - 1] + cost
          );
        }
        for (let j = 0; j <= right.length; j += 1) previous[j] = current[j];
      }

      return previous[right.length];
    }

    function fuzzyMatch(source, query) {
      const sourceText = normalizeText(source);
      const queryText = normalizeText(query);
      if (!sourceText || !queryText || queryText.length < 4) return false;

      const allowedDistance = queryText.length <= 6 ? 1 : 2;
      const sourceWords = sourceText.split(/[\s,/-]+/).filter(Boolean);
      const queryWords = queryText.split(/[\s,/-]+/).filter(Boolean);

      return queryWords.some((queryWord) =>
        sourceWords.some((sourceWord) => {
          if (sourceWord.length < 4) return false;
          const distance = levenshteinDistance(sourceWord, queryWord);
          return distance <= allowedDistance;
        })
      );
    }

    function textMatches(source, query) {
      const sourceText = normalizeText(source);
      const queryText = normalizeText(query);
      if (!queryText) return true;
      const queryVariants = getSearchVariants(queryText);
      const sourceVariants = [sourceText, ...getSearchVariants(sourceText)].filter(Boolean);
      return queryVariants.some((q) =>
        sourceVariants.some((s) => s.includes(q) || q.includes(s) || fuzzyMatch(s, q))
      );
    }

    function pickImage(seed) {
      const label = encodeURIComponent(String(seed || "CLOCHE").slice(0, 32));
      return `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 600 800'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23201812'/%3E%3Cstop offset='0.55' stop-color='%230d0d0d'/%3E%3Cstop offset='1' stop-color='%23c1a671'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='600' height='800' fill='%230d0d0d'/%3E%3Crect width='600' height='800' fill='url(%23g)' opacity='0.34'/%3E%3Ctext x='50%25' y='50%25' fill='%23c1a671' font-family='serif' font-size='34' letter-spacing='8' text-anchor='middle'%3E${label}%3C/text%3E%3C/svg%3E`;
    }

    function addCacheBuster(url) {
      if (!url) return url;
      const separator = url.includes('?') ? '&' : '?';
      return `${url}${separator}v=${Math.floor(Date.now() / 60000)}`; // Cache for 1 minute
    }

    function resolveAssetUrl(url) {
      let raw = String(url || "").trim();
      if (!raw) return "";
      if (/^data:image\//i.test(raw)) return raw;

      if (raw.includes("localhost") || raw.includes("127.0.0.1")) {
        try {
          const u = new URL(raw);
          raw = u.pathname;
        } catch (e) {}
      }
      if (/^https?:\/\//i.test(raw)) return addCacheBuster(raw);

      const normalized = raw.replace(/\\/g, "/");
      const lower = normalized.toLowerCase();
      const uploadsWithSlash = lower.indexOf("/uploads/");
      if (uploadsWithSlash >= 0) return addCacheBuster(`${API_ORIGIN}${normalized.slice(uploadsWithSlash)}`);
      const uploadsNoSlash = lower.indexOf("uploads/");
      if (uploadsNoSlash >= 0) return addCacheBuster(`${API_ORIGIN}/${normalized.slice(uploadsNoSlash)}`);

      // Try to detect Cloudinary public ID (has .png .jpg .jpeg .webp) without being a full path
      if (/\.(png|jpg|jpeg|webp)$/i.test(normalized) && !normalized.includes("/")) {
        const cloudName = cloudinaryCloudName || 'dycwsnzyd'; // Fallback to known cloud name
        return addCacheBuster(`https://res.cloudinary.com/${cloudName}/image/upload/${normalized}`);
      }

      if (cloudinaryCloudName) {
        return addCacheBuster(`https://res.cloudinary.com/${cloudinaryCloudName}/image/upload/${normalized.replace(/^\/+/, "")}`);
      }

      return addCacheBuster(`${API_ORIGIN}${normalized.startsWith("/") ? "" : "/"}${normalized}`);
    }

    async function loadCloudinaryConfig() {
      try {
        const res = await fetch(`${API_AUTH}/cloudinary-config`);
        const data = await res.json();
        if (res.ok) cloudinaryCloudName = String(data.cloudName || "").trim();
      } catch (_) {}
    }

    function normalizeLocationParts(boutique) {
      const city = String(boutique?.city || "").trim();
      let district = String(boutique?.district || "").trim();
      let area = String(boutique?.area || "").trim();
      const splitParts = (value) => String(value || "").split(",").map((part) => part.trim()).filter(Boolean);
      const samePart = (a, b) => a.toLowerCase() === b.toLowerCase();
      const duplicateLocationPart = (part, target) => {
        const a = normalizeText(part);
        const b = normalizeText(target);
        return !!a && !!b && (a === b || a.includes(b) || b.includes(a) || textMatches(a, b));
      };

      if (!area && city.includes(",")) {
        area = city.split(",")[0].trim();
      }

      if (!district) {
        if (city.includes(",")) {
          district = city.split(",").slice(1).join(",").trim();
        } else {
          district = city;
        }
      }

      if (area && district && area.toLowerCase() === district.toLowerCase()) {
        area = "";
      }

      const districtParts = splitParts(district);
      district = districtParts[districtParts.length - 1] || district;
      const areaParts = splitParts(area).filter((part) => !duplicateLocationPart(part, district));
      area = areaParts.join(", ");
      const locationLabel = [...areaParts, district]
        .filter(Boolean)
        .filter((part, index, parts) => parts.findIndex((item) => samePart(item, part) || duplicateLocationPart(item, part)) === index)
        .join(", ");
      return { area, district, locationLabel };
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderBoutiqueTags(boutique) {
      const renderTagSpans = window.__CLOCHE__ && window.__CLOCHE__.renderTagSpans;
      const spans = renderTagSpans
        ? renderTagSpans(boutique?.tags, {
          spanClass: "text-[10px] uppercase tracking-widest px-3 py-1 bg-white/5 border border-white/10 rounded"
        })
        : String(boutique?.tags || "")
          .split(",")
          .map(tag => tag.trim())
          .filter(Boolean)
          .map(tag => `<span class="text-[10px] uppercase tracking-widest px-3 py-1 bg-white/5 border border-white/10 rounded">${escapeHtml(tag)}</span>`)
          .join("");

      if (!spans) return "";

      return `<div class="flex flex-wrap gap-2 mb-8">${spans}</div>`;
    }

    function updateAuthNav() {
      const authNav = document.getElementById("authNav");
      const profileIconLink = document.getElementById("profileIconLink");
      const userMenuDropdown = document.getElementById("userMenuDropdown");
      const listYourBoutiqueNav = document.getElementById("listYourBoutiqueNav");

      const isUserLoggedIn = localStorage.getItem("isUserLoggedIn") === "true";
      const ownerName = localStorage.getItem("ownerName") || "C";
      const userName = localStorage.getItem("userName") || "User";
      const firstName = String(userName).trim().split(/\s+/)[0] || "USER";

      if (authNav) {
        if (isUserLoggedIn) {
          authNav.textContent = firstName.toUpperCase();
          authNav.href = "#";
          if (profileIconLink) profileIconLink.href = "#";
          const toggleMenu = (e) => {

            if (userMenuDropdown) userMenuDropdown.classList.toggle("hidden");

          authNav.onclick = toggleMenu;
          if (profileIconLink) profileIconLink.onclick = toggleMenu;
          if (listYourBoutiqueNav) {
            listYourBoutiqueNav.style.display = "block";
          }
        } else if (isPartnerLoggedIn) {
          if (userMenuDropdown) userMenuDropdown.classList.add("hidden");
          authNav.onclick = null;
          if (profileIconLink) profileIconLink.onclick = null;
          authNav.textContent = "DASHBOARD";
          authNav.href = "dashboard.html";
          if (profileIconLink) profileIconLink.href = "profile.html";
          // Hide "LIST YOUR BOUTIQUE" when logged in
          if (listYourBoutiqueNav) {
            listYourBoutiqueNav.style.display = "none";
          }
        } else {
          if (userMenuDropdown) userMenuDropdown.classList.add("hidden");
          authNav.onclick = null;
          if (profileIconLink) profileIconLink.onclick = null;
          authNav.textContent = "LOGIN";
          authNav.href = "boutiquelogin.html";
          if (profileIconLink) profileIconLink.href = "boutiquelogin.html";
          // Show "LIST YOUR BOUTIQUE" when not logged in
          if (listYourBoutiqueNav) {
            listYourBoutiqueNav.style.display = "block";
          }
        }
      }

      const avatar = document.getElementById("navAvatar");
      if (avatar) {
        avatar.textContent = isUserLoggedIn
          ? firstName.charAt(0).toUpperCase()
          : ownerName.charAt(0).toUpperCase();
      }
    }

      Pathanamthitta: ["Adoor", "Konni", "Kozhencherry", "Mallappally", "Pandalam", "Pathanamthitta", "Ranni", "Thiruvalla"],
      Thiruvananthapuram: ["Attingal", "Balaramapuram", "Kazhakootam", "Kilimanoor", "Kovalam", "Nedumangad", "Neyyattinkara", "Parassala", "Peroorkada", "Thiruvananthapuram", "Varkala", "Vizhinjam"],
      Thrissur: ["Chalakudy", "Chavakkad", "Guruvayur", "Irinjalakuda", "Kodungallur", "Kunnamkulam", "Mala", "Thrissur", "Wadakkanchery"],
      Wayanad: ["Kalpetta", "Mananthavady", "Meenangadi", "Pulpally", "Sulthan Bathery", "Vythiri"]
    };

    function renderFilters() {
      const districtSelect = document.getElementById("districtSelect");
      const townSelect = document.getElementById("townSelect");
      const applyBtn = document.getElementById("applyLocationBtn");

      if (!districtSelect.dataset.bound) {
        districtSelect.dataset.bound = "true";
        districtSelect.addEventListener("change", function () {
          const district = this.value;
          townSelect.innerHTML = '<option value="">All Towns</option>';
          
          if (townsByDistrict[district]) {
            townSelect.disabled = false;
            townsByDistrict[district].forEach(town => {
              townSelect.innerHTML += `<option value="${town}">${town}</option>`;
            });
          } else {
            townSelect.disabled = true;
          }
        });

        applyBtn.addEventListener("click", function() {
          selectedDistrict = districtSelect.value;
          selectedTown = townSelect.value;
          
          const label = document.getElementById("locationFilterLabel");
          if (selectedTown) {
            label.textContent = `${selectedTown}, ${selectedDistrict}`;
          } else if (selectedDistrict) {
            label.textContent = `${selectedDistrict} (All)`;
          } else {
            label.textContent = "All Locations";
          }
          
          document.getElementById('locationModal').classList.add('hidden');
          renderGrid();
        });
      }
    }

    function bindSearchInput() {
      const input = document.getElementById("searchInput");
      if (!input || input.dataset.bound) return;
      input.dataset.bound = "true";
      input.addEventListener("input", function () {
        searchTerm = this.value;
        renderGrid();
      });
    }

    function smartFilter(list, district, town, query) {
      return list.filter((boutique) => {
        const loc = normalizeLocationParts(boutique);
        const districtMatch = !district || textMatches(loc.district || boutique.city, district);
        const townMatch = !town || textMatches(loc.area || boutique.city, town);
        const searchMatch = !query || [
          boutique.boutique_name,
          loc.area,
          loc.district,
          loc.locationLabel,
          boutique.city
        ].some((value) => textMatches(value, query));

        return districtMatch && townMatch && searchMatch;
      });
    }

    function renderGrid() {
      const grid = document.getElementById("boutiquesGrid");
      const status = document.getElementById("statusText");
      if (DEBUG_TAGS) console.log("[CLOCHE] renderGrid() boutiques.html", { width: window.innerWidth, path: location.pathname });

      const list = smartFilter(boutiques, selectedDistrict, selectedTown, searchTerm);

      status.textContent = "";

      if (!list.length) {
        grid.innerHTML = `<div class="col-span-full glass-card rounded-lg p-10 text-center text-[#FAF7F2]/60">No boutiques found for this search or location.</div>`;
        return;
      }

      grid.innerHTML = list.map((boutique) => {
        if (DEBUG_TAGS) console.log("Rendering tags:", boutique.tags);
        const rawImage = boutique.image_url || boutique.showcase_image || "";
        const resolved = rawImage ? resolveAssetUrl(rawImage) : null;
        const fallback = resolved ? resolved : pickImage(`${boutique.id}-${boutique.boutique_name}`);
        const image = fallback;
        const location = normalizeLocationParts(boutique);
        const district = (location.district || "Unknown").toUpperCase();
        const locationLabel = (location.locationLabel || district).toUpperCase();
        const tagsHtml = renderBoutiqueTags(boutique);
        const safeName = JSON.stringify(String(boutique.boutique_name || ""));

        return `
        <div class="glass-card rounded-lg overflow-hidden flex flex-col transition-all duration-300">
          <a href="viewboutique.html?boutiqueId=${boutique.id}" onclick="localStorage.setItem('selectedBoutiqueId','${boutique.id}'); localStorage.setItem('selectedBoutiqueName', ${safeName})" class="relative block h-[420px] overflow-hidden group">
            <img class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" src="${image}" alt="${boutique.boutique_name || "Boutique"}" loading="lazy" onerror="this.onerror=null;this.src='${pickImage(`${boutique.id}-${boutique.boutique_name}`)}'" />
            <div class="absolute top-4 left-4 bg-primary px-3 py-1 rounded text-[10px] font-bold tracking-[0.2em] text-background-dark uppercase">${district}</div>
          </a>
          <div class="p-8 flex-1 flex flex-col">
            <div class="flex justify-between items-start mb-2 gap-2">
              <h3 class="font-display text-2xl font-semibold tracking-wide uppercase">${boutique.boutique_name || "Boutique"}</h3>
            </div>
            <p class="text-primary/70 text-sm tracking-widest uppercase mb-4 font-medium">${locationLabel}</p>
            ${tagsHtml}
            <a href="viewboutique.html?boutiqueId=${boutique.id}" onclick="localStorage.setItem('selectedBoutiqueId','${boutique.id}'); localStorage.setItem('selectedBoutiqueName', ${safeName})" class="mt-auto w-full py-4 bg-primary text-background-dark font-bold text-xs uppercase tracking-[0.2em] rounded hover:bg-white transition-all text-center gold-glow">View Boutique</a>
          </div>
        </div>
      `;
      }).join("");
    }

    function normalizePlan(plan) {
      const normalized = String(plan || "").trim().toLowerCase();
      if (["early", "basic", "early partner", "early_partner"].includes(normalized)) return "early_partner";
      if (normalized === "pro") return "premium";
      return normalized;
    }

    function sortPremiumFirst(list) {
      return [...list].sort((a, b) => {
        if (normalizePlan(a.plan) === "premium" && normalizePlan(b.plan) !== "premium") return -1;
        if (normalizePlan(b.plan) === "premium" && normalizePlan(a.plan) !== "premium") return 1;
        return 0;
      });
    }

    async function loadBoutiques() {
      const status = document.getElementById("statusText");
      status.textContent = "Loading boutiques...";

      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 60000); // 60s to allow free-tier spin up
        const res = await fetch(`${API_BASE}/boutiques?v=${Date.now()}`, {
          signal: controller.signal,
          cache: "no-store"
        });
        clearTimeout(timeoutId);
        const data = await res.json();
        if (!res.ok) throw new Error(data.message || "Failed to load boutiques");

        boutiques = sortPremiumFirst(Array.isArray(data) ? data : []);
        renderFilters();
        bindSearchInput();
        renderGrid();
      } catch (err) {
        console.log("[Boutiques] Load error:", err.message);
        status.textContent = err.name === "AbortError" ? "Server is slow. Please refresh or try again." : "Failed to load boutiques.";
        document.getElementById("boutiquesGrid").innerHTML = `<div class="col-span-full glass-card rounded-lg p-10 text-center text-red-400">${err.message}</div>`;
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      updateAuthNav();
      // Setup menu click handler
      document.addEventListener("click", (e) => {
        const menu = document.getElementById("userMenuDropdown");
        const auth = document.getElementById("authNav");
        const icon = document.getElementById("profileIconLink");
        if (!menu || menu.classList.contains("hidden")) return;
        if (menu.contains(e.target) || (auth && auth.contains(e.target)) || (icon && icon.contains(e.target))) return;
        menu.classList.add("hidden");
      });
      
      // Setup menu scroll handler
      window.addEventListener("scroll", () => {
        const menu = document.getElementById("userMenuDropdown");
        if (menu && !menu.classList.contains("hidden")) {
          menu.classList.add("hidden");
        }
      });
      
      // Setup logout handler
      if (logoutBtn) {
        logoutBtn.addEventListener("click", () => {
          window.logout();
        });
      }
      loadCloudinaryConfig();
      loadBoutiques();
    });
  </script>
  <script src='responsive-layout.js?v=20260501-partner-signup'></script>
  <script src="footer.js?v=20260505-footer-fix"></script>
</body>
