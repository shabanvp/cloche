<!DOCTYPE html>
<html class="dark" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Reset Password | CLOCHE</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            primary: "#c1a671",
            "background-dark": "#0d0d0d"
          },
          fontFamily: {
            display: ["Noto Serif", "serif"],
            sans: ["Inter", "sans-serif"]
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="responsive-fixes.css?v=1776237132140" />
</head>

<body class="bg-background-dark min-h-screen flex items-center justify-center p-6 text-white font-sans">
  <main class="w-full max-w-md border border-primary/20 bg-[#14120f]/80 rounded-xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <p class="text-primary text-xs tracking-[0.35em] font-bold mb-3">CLOCHE</p>
      <h1 class="font-display text-3xl tracking-[0.12em]">Reset Password</h1>
      <p class="text-white/55 text-sm mt-3">Choose a new password for your account.</p>
    </div>

    <form id="resetForm" class="space-y-5">
      <div>
        <label class="block text-xs uppercase tracking-[0.14em] text-white/80 mb-2">New Password</label>
        <input id="password" type="password" required minlength="8" class="w-full h-13 rounded-lg border border-white/10 bg-white/5 text-white px-4" placeholder="Minimum 8 characters" />
      </div>
      <div>
        <label class="block text-xs uppercase tracking-[0.14em] text-white/80 mb-2">Confirm Password</label>
        <input id="confirmPassword" type="password" required minlength="8" class="w-full h-13 rounded-lg border border-white/10 bg-white/5 text-white px-4" placeholder="Repeat password" />
      </div>
      <button id="submitBtn" class="w-full h-13 rounded-lg bg-primary text-black font-display font-bold uppercase tracking-[0.18em] text-sm">
        Update Password
      </button>
    </form>

    <p id="message" class="min-h-5 text-center text-xs text-white/60 mt-5"></p>

    <div class="text-center mt-8">
      <a href="boutiquelogin.html" class="text-primary/80 hover:text-primary text-xs uppercase tracking-[0.12em]">Back to login</a>
    </div>
  </main>

  <script>
    const API_BASE = (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1" || window.location.protocol === "file:")
      ? "http://localhost:5001"
      : "https://cloche-backend.onrender.com";

    const params = new URLSearchParams(window.location.search);
    const token = params.get("token") || "";
    const accountType = params.get("type") === "partner" ? "partner" : "user";
    const message = document.getElementById("message");

    if (!token) {
      message.textContent = "Reset link is missing or invalid.";
      message.className = "min-h-5 text-center text-xs text-red-300 mt-5";
      document.getElementById("submitBtn").disabled = true;
    }

    document.getElementById("resetForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const submitBtn = document.getElementById("submitBtn");

      if (password.length < 8) {
        message.textContent = "Password must be at least 8 characters.";
        message.className = "min-h-5 text-center text-xs text-red-300 mt-5";
        return;
      }

      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        message.className = "min-h-5 text-center text-xs text-red-300 mt-5";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "Updating...";
      message.textContent = "";

      try {
        const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password, account_type: accountType })
        });
        const data = await res.json();

        if (res.ok) {
          message.textContent = data.message || "Password updated. You can now login.";
          message.className = "min-h-5 text-center text-xs text-primary mt-5";
          setTimeout(() => {
            window.location.href = `boutiquelogin.html?type=${encodeURIComponent(accountType)}`;
          }, 1500);
        } else {
          message.textContent = data.message || "Failed to reset password.";
          message.className = "min-h-5 text-center text-xs text-red-300 mt-5";
        }
      } catch (err) {
        message.textContent = "Server error. Please try again.";
        message.className = "min-h-5 text-center text-xs text-red-300 mt-5";
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = "Update Password";
      }
    });
  </script>
</body>

</html>
